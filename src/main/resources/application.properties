spring.application.name=CIneLuis

# --- Conexion a la base de datos -----------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=${DB_SCHEMA}

# --- JPA / Hibernate -----------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Servidor ------------------------------------------------
server.port=8080

# --- Depuracion de seguridad ---------------------------------
# --- Errores de la API ---------------------------------------
server.error.include-message=always
server.error.include-stacktrace=never

# --- Errores de la API ---------------------------------------
server.error.include-message=always
server.error.include-stacktrace=never

# --- JWT -----------------------------------------------------
# En produccion define la variable de entorno JWT_SECRET (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:cineluis-clave-de-desarrollo-cambiar-en-produccion-0123456789}
app.jwt.expiracion-minutos=120
